plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "troll-client"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	runs {
		// ./gradlew runDevShots : scripted visual smoke test, screenshots land in run/screenshots
		devShots {
			client()
			name = "Dev Screenshots"
			vmArg "-Dtrollclient.devshots=true"
			runDir "run"
		}
		// ./gradlew runShowcase : records the showcase video's frames to run-showcase/showcase/frames
		showcase {
			client()
			name = "Showcase Recorder"
			vmArg "-Dtrollclient.showcase=true"
			programArgs "--username", "TrollClient", "--width", "1280", "--height", "720"
			runDir "run-showcase"
		}
	}
}
