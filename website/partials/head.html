<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="{{canonical}}">
<meta property="og:site_name" content="Troll Client">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="{{image-width}}">
<meta property="og:image:height" content="{{image-height}}">
<meta property="og:image:alt" content="{{image-alt}}">
<meta name="twitter:card" content="{{card}}">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
<link rel="icon" type="image/png" sizes="384x384" href="img/favicon-384.png">
<link rel="preload" href="fonts/troll-terminal.woff2" as="font" type="font/woff2" crossorigin>
<script type="application/ld+json">{{structured-data}}</script>
